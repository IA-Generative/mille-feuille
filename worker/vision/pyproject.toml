[project]
name = "mille-feuille-worker-ocr-vision"
version = "0.30.2"
description = "Worker Celery qui décrit les images et les tableaux d'une page scannée avec un VLM du hub"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7.3",
    "boto3>=1.43.98",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
