[project]
name = "mille-feuille-worker-agent-execution"
version = "0.13.0-rc"
description = "Worker Celery : exécution de l'agent d'instruction de dossier"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.100",
    "celery>=5.6.3",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "openai>=3.19.0",
    "pydantic-settings>=2.15.0",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
