[project]
name = "mille-feuille-async-api-worker"
version = "0.1.0"
description = "Worker AsyncTaskAPI (RabbitMQ, sans Celery) qui exécute des analyses mille-feuille via l'API éphémère"
requires-python = ">=3.13"
dependencies = [
    "millefeuille",
    "millefeuille-ephemeral",
    # Bibliothèque de worker d'async-api : non publiée sur PyPI, donc épinglée sur un commit de sa
    # branche d'intégration `beta` (manifeste avec `moteur` et `taille_max_fichier_mio`, /__version__).
    # À remonter sur un tag dès que mic-worker en portera un ; async-api le contrôle (externe.yaml).
    "mic-worker @ git+https://github.com/IA-Generative/async-api@c710ebf725cdf5bccc0e139cc341f187faf0edc2#subdirectory=workers/python/mic-worker",
    "loguru>=0.7.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

# Les SDK du monorepo (même chemin relatif en local et dans l'image : voir Dockerfile).
[tool.uv.sources]
millefeuille-ephemeral = { path = "../../sdks/python/millefeuille-ephemeral", editable = true }
# editable : le SDK éphémère déclare lui-même millefeuille en editable, uv refuse deux déclarations divergentes.
millefeuille = { path = "../../sdks/python/millefeuille", editable = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../../sdks/python/testing"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = ["**/__init__.py", "src/logger.py", "src/config.py"]
