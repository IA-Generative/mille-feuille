[project]
name = "mille-feuille-worker-document-process"
version = "0.12.4"
description = "Worker Celery : extraction de texte PDF, NER et relations"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.100",
    "celery>=5.6.3",
    "httpx>=0.28.1",
    "liteparse>=2.14.4",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
