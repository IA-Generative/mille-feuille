[project]
name = "mille-feuille-worker-classification"
version = "0.20.0"
description = "Worker Celery : classification des pages d'un dossier (VLM + LLM)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.100",
    "celery>=5.6.3",
    "httpx>=0.28.1",
    "openai>=3.19.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "torch>=2.5.0",
    "transformers>=4.50.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# torch en version CPU uniquement (pas de CUDA : ~200 Mo au lieu de plusieurs Go).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
