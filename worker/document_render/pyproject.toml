[project]
name = "mille-feuille-worker-document-render"
version = "0.15.0"
description = "Worker Celery : remplissage de modèles ODT et conversion PDF avec LibreOffice"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.100",
    "celery>=5.6.3",
    "jinja2>=3.1.6",
    "lxml>=6.0.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
markers = [
    "libreoffice: nécessite LibreOffice (soffice) : ignoré s'il n'est pas installé (par exemple en CI sans l'image du worker)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
