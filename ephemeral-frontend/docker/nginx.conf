server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Configuration d'exécution, écrite au démarrage du conteneur dans /tmp (docker/40-runtime-config.sh) : le système
    # de fichiers du conteneur est en lecture seule. Jamais mise en cache : une valeur changée doit s'appliquer.
    location = /config.js {
        root /tmp;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
