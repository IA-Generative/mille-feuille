[project]
name = "mille-feuille-backend"
version = "0.13.0"
description = "BFF (Backend For Frontend) de mille-feuille"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-keycloak>=7.1.1",
    "redis>=8.1.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.31.0",
    "alembic>=1.16.0",
    "python-multipart>=0.0.32",
    "boto3>=1.43.100",
    "celery>=5.6.3",
    "openai>=3.19.0",
    "mcp>=2.2.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
    "httpx>=0.28.1",
    "fakeredis>=2.38.0",
    "ruff>=0.15.0",
]
dev = [{ include-group = "test" }, "eralchemy2>=1.4.1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
env_files = ["tests/.env.testing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
