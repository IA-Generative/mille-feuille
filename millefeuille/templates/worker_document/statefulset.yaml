{{- if .Values.enabled }}
{{- if eq .Values.worker_document.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_document") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "worker_document") | nindent 4 }}
spec:
  {{- if not (or .Values.worker_document.autoscaling.enabled .Values.worker_document.kedaAutoscaler.enabled) }}
  replicas: {{ .Values.worker_document.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker_document.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_document") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_document") }}
  {{- with .Values.worker_document.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_document" "component" .Values.worker_document) | nindent 4 }}
  {{- if or .Values.worker_document.volumeClaims .Values.worker_document.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.worker_document.volumeClaims) (default (list) .Values.worker_document.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
