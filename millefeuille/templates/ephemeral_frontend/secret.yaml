{{- if .Values.enabled }}
{{- if or .Values.ephemeral_frontend.envSecret .Values.global.envSecret -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "ephemeral_frontend") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "ephemeral_frontend")) | nindent 4 }}
data:
  {{- if .Values.global.envSecret -}}
  {{- include "helper.secret" (dict "root" . "data" .Values.global.envSecret) | indent 2 }}
  {{- end -}}
  {{- if .Values.ephemeral_frontend.envSecret -}}
  {{- include "helper.secret" (dict "root" . "data" .Values.ephemeral_frontend.envSecret) | indent 2 }}
  {{- end -}}
{{- end -}}
{{- end }}
