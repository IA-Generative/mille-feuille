{{- if .Values.enabled }}
{{- if and .Values.ephemeral_frontend.serviceAccount.enabled .Values.ephemeral_frontend.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.ephemeral_frontend.serviceAccount.name | default (include "helper.componentFullname" (dict "root" . "componentName" "ephemeral_frontend")) }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "ephemeral_frontend")) | nindent 4 }}
  {{- if .Values.ephemeral_frontend.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .Values.ephemeral_frontend.serviceAccount.annotations) . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.ephemeral_frontend.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
