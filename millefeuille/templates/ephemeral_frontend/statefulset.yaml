{{- if .Values.enabled }}
{{- if eq .Values.ephemeral_frontend.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "ephemeral_frontend") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "ephemeral_frontend") | nindent 4 }}
spec:
  {{- if not .Values.ephemeral_frontend.autoscaling.enabled }}
  replicas: {{ .Values.ephemeral_frontend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.ephemeral_frontend.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "ephemeral_frontend") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "ephemeral_frontend") }}
  {{- with .Values.ephemeral_frontend.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "ephemeral_frontend" "component" .Values.ephemeral_frontend) | nindent 4 }}
  {{- if or .Values.ephemeral_frontend.volumeClaims .Values.ephemeral_frontend.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.ephemeral_frontend.volumeClaims) (default (list) .Values.ephemeral_frontend.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
