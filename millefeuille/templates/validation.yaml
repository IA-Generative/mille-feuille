{{- /*
Values validation only - this template intentionally renders no resource. It exists so
`helper.component.validate` runs on every `helm template`/`helm lint`/`helm install`, including
for combinations where the workload templates themselves would render nothing (e.g. an unknown
`deploymentType`, which would otherwise silently produce a release with no workload at all).
Add one `include` line per component when you add components to this chart.
*/ -}}
{{- if .Values.enabled }}
{{- include "helper.component.validate" (dict "name" "frontend" "component" .Values.frontend) }}
{{- include "helper.component.validate" (dict "name" "ephemeral_frontend" "component" .Values.ephemeral_frontend) }}
{{- include "helper.component.validate" (dict "name" "backend" "component" .Values.backend) }}
{{- include "helper.component.validate" (dict "name" "worker_agent" "component" .Values.worker_agent) }}
{{- include "helper.component.validate" (dict "name" "worker_classification" "component" .Values.worker_classification) }}
{{- include "helper.component.validate" (dict "name" "worker_extraction" "component" .Values.worker_extraction) }}
{{- include "helper.component.validate" (dict "name" "worker_document" "component" .Values.worker_document) }}
{{- include "helper.component.validate" (dict "name" "worker_render" "component" .Values.worker_render) }}
{{- /* Opt-in component: validated (and rendered) only once `worker_async_api.enabled` is true. */ -}}
{{- if .Values.worker_async_api.enabled }}
{{- include "helper.component.validate" (dict "name" "worker_async_api" "component" .Values.worker_async_api) }}
{{- end }}
{{- end }}
