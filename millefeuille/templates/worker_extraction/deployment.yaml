{{- if .Values.enabled }}
{{- if eq .Values.worker_extraction.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_extraction") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_extraction")) | nindent 4 }}
spec:
  {{- if not .Values.worker_extraction.autoscaling.enabled }}
  replicas: {{ .Values.worker_extraction.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker_extraction.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_extraction") | nindent 6 }}
  strategy:
    type: {{ .Values.worker_extraction.strategy.type }}
    {{- if eq .Values.worker_extraction.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.worker_extraction.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.worker_extraction.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_extraction" "component" .Values.worker_extraction) | nindent 4 }}
{{- end }}
{{- end }}
