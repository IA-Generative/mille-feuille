{{- if .Values.enabled }}
{{- $k := .Values.worker_extraction.kedaAutoscaler }}
{{- if and $k.enabled $k.redis.secretRef $k.redis.secretKey }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $k.redis.authenticationRef | default (include "helper.componentFullname" (dict "root" . "componentName" "worker_extraction")) }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_extraction")) | nindent 4 }}
spec:
  secretTargetRef:
  - parameter: "password"
    name: {{ tpl $k.redis.secretRef . | quote }}
    key: {{ $k.redis.secretKey | quote }}
{{- end }}
{{- end }}
