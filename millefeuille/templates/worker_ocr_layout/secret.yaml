{{- if and .Values.enabled .Values.worker_ocr_layout.enabled }}
{{- if or .Values.worker_ocr_layout.envSecret .Values.global.envSecret -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_ocr_layout") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_ocr_layout")) | nindent 4 }}
data:
  {{- if .Values.global.envSecret -}}
  {{- include "helper.secret" (dict "root" . "data" .Values.global.envSecret) | indent 2 }}
  {{- end -}}
  {{- if .Values.worker_ocr_layout.envSecret -}}
  {{- include "helper.secret" (dict "root" . "data" .Values.worker_ocr_layout.envSecret) | indent 2 }}
  {{- end -}}
{{- end -}}
{{- end }}
