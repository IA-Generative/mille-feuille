{{- if and .Values.enabled .Values.worker_ocr_layout.enabled }}
{{- if eq .Values.worker_ocr_layout.deploymentType "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_ocr_layout") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_ocr_layout")) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.worker_ocr_layout.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_ocr_layout") | nindent 6 }}
  {{- with .Values.worker_ocr_layout.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_ocr_layout" "component" .Values.worker_ocr_layout) | nindent 4 }}
{{- end }}
{{- end }}
