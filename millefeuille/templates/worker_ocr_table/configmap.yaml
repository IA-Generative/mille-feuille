{{- if and .Values.enabled .Values.worker_ocr_table.enabled }}
{{- if or .Values.worker_ocr_table.envCm .Values.global.envCm -}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_ocr_table") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_ocr_table")) | nindent 4 }}
data:
  {{- if .Values.global.envCm -}}
  {{- include "helper.env" (dict "root" . "data" .Values.global.envCm) | indent 2 }}
  {{- end -}}
  {{- if .Values.worker_ocr_table.envCm -}}
  {{- include "helper.env" (dict "root" . "data" .Values.worker_ocr_table.envCm) | indent 2 }}
  {{- end -}}
{{- end -}}
{{- end }}
