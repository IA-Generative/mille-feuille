{{- if and .Values.enabled .Values.worker_ocr.enabled }}
{{- if or .Values.worker_ocr.envCm .Values.global.envCm -}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_ocr") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_ocr")) | nindent 4 }}
data:
  {{- if .Values.global.envCm -}}
  {{- include "helper.env" (dict "root" . "data" .Values.global.envCm) | indent 2 }}
  {{- end -}}
  {{- if .Values.worker_ocr.envCm -}}
  {{- include "helper.env" (dict "root" . "data" .Values.worker_ocr.envCm) | indent 2 }}
  {{- end -}}
{{- end -}}
{{- end }}
