{{- if and .Values.enabled .Values.worker_ocr_vision.enabled }}
{{- if eq .Values.worker_ocr_vision.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_ocr_vision") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_ocr_vision")) | nindent 4 }}
spec:
  {{- if not .Values.worker_ocr_vision.autoscaling.enabled }}
  replicas: {{ .Values.worker_ocr_vision.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker_ocr_vision.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_ocr_vision") | nindent 6 }}
  strategy:
    type: {{ .Values.worker_ocr_vision.strategy.type }}
    {{- if eq .Values.worker_ocr_vision.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.worker_ocr_vision.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.worker_ocr_vision.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_ocr_vision" "component" .Values.worker_ocr_vision) | nindent 4 }}
{{- end }}
{{- end }}
