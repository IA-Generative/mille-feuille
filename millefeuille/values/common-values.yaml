  - secretRef:
      name: "millefeuille-worker"
  - secretRef:
      name: "millefeuille-redis"
  # Parallélisme et délais EXPLICITES : sans --concurrency Celery lance un processus par cœur du
  # nœud (os.cpu_count()), invisible et sans rapport avec les ressources du pod ; sans --time-limit une
  # étape bloquée sur le hub tient la file indéfiniment. Ces valeurs sont les points de départ du test
  # de charge d'async-api (lot C) : WORKER_CONCURRENCY x maxReplicaCount du pont doit rester sous la
  # somme des concurrences de ces workers (contre-pression).
  args:
