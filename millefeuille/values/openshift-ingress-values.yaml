# Surcharge « ingress » pour OpenShift : à ajouter APRÈS common-values.yaml et openshift-values.yaml.
#   helm template millefeuille ./millefeuille -f values/common-values.yaml \
#     -f values/openshift-values.yaml -f values/openshift-ingress-values.yaml
#
# Un Ingress par composant (OpenShift le convertit en Route), sans bloc `tls` ni annotation propre à OpenShift.
# Les HÔTES CI-DESSOUS SONT FICTIFS : les vrais domaines ne vont pas dans ce dépôt public, ils se posent dans les values de
# l'environnement (Argo CD) en surchargeant `frontend.ingress.hosts` et `backend.ingress.hosts`.

# L'Ingress du chart (global.ingress, sans hôte ni service) est remplacé par un Ingress par composant, ci-dessous.
global:
  ingress:
    enabled: false

# Même hôte pour le front et l'API : le front appelle l'API en URL relative, `/api` va au backend.
frontend:
  ingress:
    enabled: true
    hosts:
      - name: "millefeuille.example.org"
        paths:
          - path: "/"
            pathType: "Prefix"
            # Sans `backend`, le template vise le port 80 : le Service du frontend écoute sur 8080.
            backend:
              portNumber: 8080

backend:
  ingress:
    enabled: true
    hosts:
      - name: "millefeuille.example.org"
        paths:
          - path: "/api"
            pathType: "Prefix"
            # Sans `backend`, le template vise le port 80 : le Service du backend écoute sur 8000.
            backend:
              portNumber: 8000
