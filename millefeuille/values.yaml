#   # -- How to treat concurrent executions, one of "Allow", "Forbid" or "Replace".
#   concurrencyPolicy: "Forbid"
#   # -- Pause new scheduled executions without deleting the CronJob.
#   suspend: false
#   # -- Deadline (in seconds) for starting the job if it misses its scheduled time.
#   startingDeadlineSeconds: 300
#   # -- Number of successful finished jobs to keep.
#   successfulJobsHistoryLimit: 3
#   # -- Number of failed finished jobs to keep.
#   failedJobsHistoryLimit: 1
#   image:
#     registry: "docker.io"
#     repository: "debian"
#     pullPolicy: "IfNotPresent"
#     tag: "9.9.9"
#   command: []
#   args: []
#   # - "archive"
#   # - "--older-than=30d"
#   envFrom: []
#   env: {}
#   envCm: {}
#   envSecret: {}
#   resources: {}
#   volumes: []
#   volumeMounts: []
#   restartPolicy: "Never"

# -- Map of extra specs to dynamically add to this chart. Each key is a unique, arbitrary name
# for the object (only used so `-f` values files/overrides can add, override or remove a single
# entry by key instead of the whole list - lists don't merge across values files in Helm).
# @section -- General
extraObjects: {}
# my-configmap:
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: my-configmap
#   data:
#     key: test
# my-vault-secret:
