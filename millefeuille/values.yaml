    #   ports:
    #   - protocol: TCP
    #     port: 32000
    #     endPort: 32768
  metrics:
    # -- Deploy metrics service.
    # @section -- Worker_async_api
    enabled: false
    service:
      # -- Type of metrics service to create.
      # @section -- Worker_async_api
      type: "ClusterIP"
      # -- Metrics service annotations.
      # @section -- Worker_async_api
      annotations: {}
