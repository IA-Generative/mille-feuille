# -- Map of Jobs to create (e.g. one-off DB migrations, data seeding, archiving...). Each key
# is used as the job name and as its `app.kubernetes.io/component` label. Every entry accepts
# the fields documented in the commented example below.
# @section -- General
jobs:
  migration:
    # -- Run as a Helm hook so migrations execute before the new version
    # serves traffic (pre-install + pre-upgrade).
    hook:
      enabled: true
      types:
        - "pre-install"
        - "pre-upgrade"
      weight: 0
      deletePolicy: "before-hook-creation,hook-succeeded"
    image:
      registry: "ghcr.io"
      repository: "ia-generative/mille-feuille/backend"
      pullPolicy: "IfNotPresent"
      tag: ""
      digest: ""
    imagePullSecrets: []
    serviceAccount:
      enabled: false
      create: false
      name: ""
      annotations: {}
      automountServiceAccountToken: false
    podAnnotations: {}
    podLabels: {}
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
      seccompProfile:
        type: "RuntimeDefault"
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop: ["ALL"]
    initContainers: []
    extraContainers: []
    command: []
    args:
      - "alembic"
      - "upgrade"
      - "head"
    envFrom: []
    env: {}
    envCm: {}
    envSecret: {}
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    volumes:
      - name: "tmp"
        emptyDir: {}
    extraVolumes: []
    volumeMounts:
      - name: "tmp"
        mountPath: "/tmp"
    extraVolumeMounts: []
    hostAliases: []
    nodeSelector: {}
    affinity: {}
    tolerations: []
    backoffLimit: 3
    ttlSecondsAfterFinished: 300
    activeDeadlineSeconds: null
    completions: null
    parallelism: 1
    restartPolicy: "Never"
