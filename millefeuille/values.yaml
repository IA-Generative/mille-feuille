#   kind: VaultStaticSecret
#   metadata:
#     name: foo
#     labels:
#       foo/bar: "baz"
#     annotations:
#       foo/bar: "baz"
#   spec:
#     mount: "my-kv"
#     vaultAuthRef: "my-vault-auth"
#     path: "dev/foo"
#     version: 21
#     type: "kv-v2"
#     refreshAfter: "30s"
#     hmacSecretData: true
#     rolloutRestartTargets:
#     - kind: Deployment
#       name: frontend
#     destination:
#       create: true
#       overwrite: true
#       labels:
#         foo/bar: "baz"
#       annotations:
#         foo/bar: "baz"
#       name: foo
#       type: "Opaque"
## Additional services comming from dependencies can be configured below.
## Ref: https://artifacthub.io/packages/helm/this-is-tobi-helm-charts/cnpg-cluster
# cnpg:
#   enabled: false
#   fullnameOverride: frontend-pg-cluster
#   imageName: ghcr.io/cloudnative-pg/postgresql:17.6
