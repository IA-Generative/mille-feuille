  # -- List of volumes to add. Prefer this for volumes the chart itself always needs (e.g.
  # security-hardening `emptyDir`s); use `extraVolumes` below for anything you add on top, so
  # overriding one doesn't require repeating the other. Defaults to a `/tmp` `emptyDir`, which is
  # what makes the default `securityContext.readOnlyRootFilesystem: true` usable - drop it only if
  # you also relax that. Helm replaces lists wholesale rather than merging them, so overriding this
  # key means restating the entries you want to keep.
  # @section -- Worker_render
  volumes:
    - name: "tmp"
