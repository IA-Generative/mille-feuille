  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
  #   rollingUpdate:
  #     partition: 0
  #     maxUnavailable: 1
  # DaemonSet:
  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
