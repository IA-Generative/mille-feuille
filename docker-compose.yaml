services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In docker-compose dev, frontend (:8081) and backend (:8000) are on
        # different ports, so the frontend needs an absolute API base URL.
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      # Host 8081, not 8080: Keycloak already claims host 8080 below.
      - "8081:8080"
    restart: unless-stopped

  # Frontend autonome de l'API éphémère : dépôt d'un fichier, classification / extraction à la volée.
  ephemeral-frontend:
    build:
      context: ./ephemeral-frontend
      dockerfile: Dockerfile
    environment:
      # Configuration d'exécution (voir ephemeral-frontend/docker/40-runtime-config.sh).
      API_BASE_URL: http://localhost:8000
      MILLEFEUILLE_URL: http://localhost:8081
    ports:
      - "8082:8080"
    restart: unless-stopped

  # One-shot: runs Alembic migrations to head, then exits. The backend (and
  # every worker that talks to it) depends on this completing successfully,
  # so a fresh `docker compose down -v && up` never starts the app against an
  # empty DB.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://millefeuille:millefeuille@postgres:5432/millefeuille
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://millefeuille:millefeuille@postgres:5432/millefeuille
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY:-dev-only-meili-key-not-for-prod}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: mille-feuille
      KEYCLOAK_CLIENT_ID: mille-feuille-backend
      KEYCLOAK_CLIENT_SECRET: dev-only-secret-not-for-prod
      BACKEND_PUBLIC_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8081
      # Frontend autonome de l'API éphémère (CORS + redirect post-login).
      EPHEMERAL_FRONTEND_URL: http://localhost:8082
      # HTTP en dev local : le cookie de session ne serait jamais posé par le
      # navigateur si Secure=True (il l'ignore sur les connexions non-HTTPS).
      SESSION_COOKIE_SECURE: "false"
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_S3_BUCKET_NAME: mille-feuille
      SHARE_SECRET_KEY: ${SHARE_SECRET_KEY:-dev-only-share-secret-not-for-prod}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-dev-only-worker-token-not-for-prod}
      # Clé d'API donnant accès à /api/ephemeral/* (toujours non persistant) - vide par défaut : désactivée.
      EPHEMERAL_API_KEY: ${EPHEMERAL_API_KEY:-}
      # Hub LLM (compatible API OpenAI) pour GET /api/models et le choix de
      # modèle d'une conversation/agent - vide par défaut (503 tant que non
      # configuré, voir app/config/llm.py).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-document-process:
    build:
      context: ./worker/document_process
      dockerfile: Dockerfile
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-dev-only-worker-token-not-for-prod}
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_S3_BUCKET_NAME: mille-feuille
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  # Agents, chat, résumés, propositions de notes. La classification et l'extraction d'entités ont leur propre
  # worker (code, image et file Celery séparés) : voir plus bas.
  worker-agent-execution:
    build:
      context: ./worker/agent_execution
      dockerfile: Dockerfile
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-dev-only-worker-token-not-for-prod}
      # Hub LLM (compatible API OpenAI), modèle servi par le hub configuré (Scaleway AI par défaut).
      # Surchargeable via .env / .env.local sans toucher au code.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-instruct}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-not-for-prod}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # Classification des pages (file `classification`) : lit les captures de pages sur S3, les décrit avec un VLM
  # puis classe chaque page avec un LLM.
  worker-classification:
    build:
      context: ./worker/classification
      dockerfile: Dockerfile
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-dev-only-worker-token-not-for-prod}
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_S3_BUCKET_NAME: mille-feuille
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-instruct}
      VLM_MODEL: ${VLM_MODEL:-pixtral-12b-2409}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  # Extraction des entités (file `entity_extraction`) : LLM en structured output sur le texte des pages, sans S3.
  worker-extraction:
    build:
      context: ./worker/extraction
      dockerfile: Dockerfile
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-dev-only-worker-token-not-for-prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-instruct}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # Remplit les modèles ODT et produit les PDF (LibreOffice sans interface). Voir worker/document_render/README.md.
  worker-document-render:
    build:
      context: ./worker/document_render
      dockerfile: Dockerfile
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_S3_BUCKET_NAME: mille-feuille
    depends_on:
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  # Worker AsyncTaskAPI (RabbitMQ, sans Celery) : exécute des analyses mille-feuille via l'API
  # éphémère, pour être consommé par https://github.com/IA-Generative/async-api. Hors du
  # `docker compose up` par défaut : `docker compose --profile async-api up`. Voir
  # worker/async_api/README.md (jeton d'accès à async-api requis pour construire l'image).
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["async-api"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-only-rabbitmq-not-for-prod}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-async-api:
    profiles: ["async-api"]
    build:
      # Contexte = racine du dépôt : l'image embarque les SDK de sdks/python/.
      context: .
      dockerfile: worker/async_api/Dockerfile
      secrets:
        - github_token
    environment:
      BROKER_URL: amqp://${RABBITMQ_USER:-dev}:${RABBITMQ_PASSWORD:-dev-only-rabbitmq-not-for-prod}@rabbitmq:5672
      IN_QUEUE_NAME: mille_feuille_queue_in
      OUT_QUEUE_NAME: mille_feuille_queue_out
      SERVICE_CLASS: long
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_S3_BUCKET_NAME: mille-feuille
      AWS_S3_VERIFY: "false"
      MILLEFEUILLE_BASE_URL: http://backend:8000
      # Token API créé via POST /api/app-tokens (compte de service du worker).
      MILLEFEUILLE_API_TOKEN: ${ASYNC_API_WORKER_TOKEN:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  # Purge des ressources éphémères expirées (analyses/dossiers créés via
  # /api/ephemeral/*, voir docs/ephemeral-api.md) : réutilise l'image et les
  # modèles/repositories du backend (accès direct DB + S3), avec Celery beat
  # embarqué (-B) plutôt qu'un service séparé - un seul consommateur sur la
  # file "maintenance", pas de contention à éviter en embarquant beat ici.
  backend-maintenance:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # -s : /app n'est pas inscriptible par l'utilisateur non-root du
    # conteneur (Dockerfile) - le fichier de planification de beat va donc
    # dans /tmp plutôt que le cwd par défaut.
    command:
      [
        "celery",
        "-A",
        "app.tasks:celery_client",
        "worker",
        "-B",
        "-s",
        "/tmp/celerybeat-schedule",
        "--loglevel=info",
        "--queues=maintenance",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://millefeuille:millefeuille@postgres:5432/millefeuille
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-dev-only-rustfs-key-not-for-prod}
      AWS_S3_BUCKET_NAME: mille-feuille
      SHARE_SECRET_KEY: ${SHARE_SECRET_KEY:-dev-only-share-secret-not-for-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: millefeuille
      POSTGRES_PASSWORD: millefeuille
      POSTGRES_DB: millefeuille
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U millefeuille"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-only-meili-key-not-for-prod}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # Index de recherche des dossiers (hybride dense + creux) : un alias `dossier_<id>` par dossier.
  qdrant:
    image: qdrant/qdrant:v1.15.3
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-not-for-prod}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    # Importe le realm mille-feuille (client + utilisateurs de dev) au premier
    # démarrage. --import-realm ne réimporte pas si le realm existe déjà, ce
    # qui évite d'écraser les modifs faites à la main ensuite.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      # Monté dans /opt/keycloak/data/import : Keycloak y cherche les *.json
      # au démarrage quand --import-revalm est passé.
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # RustFS simule un bucket S3 en local/dev (voir StorageSettings) : même API
  # que le S3 réel utilisé en prod, seul AWS_ENDPOINT_URL change.
  rustfs:
    image: rustfs/rustfs:latest
    # L'image tourne par défaut avec l'utilisateur non-root `rustfs` (uid
    # 10001), mais le volume Docker appartient à root : RustFS ne peut pas
    # écrire dans /data/rustfs0 et s'arrête en "Permission denied". On force
    # root le temps que l'image corrige ça (ou qu'on chown le volume).
    user: root
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-dev-only-rustfs-key-not-for-prod}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-dev-only-rustfs-key-not-for-prod}
    volumes:
      - rustfs-data:/data/rustfs0
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

# Jeton d'accès (lecture) au dépôt privé IA-Generative/async-api, nécessaire au build de
# worker-async-api : `export GH_TOKEN=$(gh auth token)` avant `docker compose --profile async-api build`.
secrets:
  github_token:
    environment: GH_TOKEN

volumes:
  postgres-data:
  meilisearch-data:
  qdrant-data:
  rustfs-data:
