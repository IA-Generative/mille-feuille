name: Lint

on:
  workflow_call:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run the backend/worker linters
        required: false
        type: string
        default: "3.12"
    secrets:
      ASYNC_API_TOKEN:
        description: >-
          Jeton en lecture (Contents: read) sur le dépôt privé IA-Generative/async-api, qui héberge
          `mic-worker`. Absent, les jobs du worker async_api sont ignorés.
        required: false
  workflow_dispatch:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run the backend/worker linters
        required: false
        type: string
        default: "3.12"

jobs:
  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm run typecheck

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        # --group test, not --group dev: the dev group also pulls in eralchemy2
        # (ER diagram generation), whose pygraphviz dependency needs system
        # graphviz headers this runner doesn't have - CI only needs the tests.
        run: uv sync --group test

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

  lint-worker-document-process:
    name: Lint worker/document_process
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/document_process/uv.lock

      - name: Install worker dependencies
        working-directory: worker/document_process
        run: uv sync --group dev

      - name: Ruff check
        working-directory: worker/document_process
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: worker/document_process
        run: uv run ruff format --check .

  lint-worker-document-render:
    name: Lint worker/document_render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/document_render/uv.lock

      - name: Install worker dependencies
        working-directory: worker/document_render
        run: uv sync --group dev

      - name: Ruff check
        working-directory: worker/document_render
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: worker/document_render
        run: uv run ruff format --check .

  lint-worker-agent-execution:
    name: Lint worker/agent_execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/agent_execution/uv.lock

      - name: Install worker dependencies
        working-directory: worker/agent_execution
        run: uv sync --group dev

      - name: Ruff check
        working-directory: worker/agent_execution
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: worker/agent_execution
        run: uv run ruff format --check .

  lint-worker-classification:
    name: Lint worker/classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/classification/uv.lock

      - name: Install worker dependencies
        working-directory: worker/classification
        run: uv sync --group dev

      - name: Ruff check
        working-directory: worker/classification
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: worker/classification
        run: uv run ruff format --check .

  lint-worker-extraction:
    name: Lint worker/extraction
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/extraction/uv.lock

      - name: Install worker dependencies
        working-directory: worker/extraction
        run: uv sync --group dev

      - name: Ruff check
        working-directory: worker/extraction
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: worker/extraction
        run: uv run ruff format --check .

  lint-worker-async-api:
    name: Lint worker/async_api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASYNC_API_TOKEN: ${{ secrets.ASYNC_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # mic-worker vit dans un dépôt privé : sans jeton, on ne peut pas installer le worker.
      - name: Check async-api access
        id: access
        run: |
          if [ -n "$ASYNC_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ASYNC_API_TOKEN absent : lint de worker/async_api ignoré."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.access.outputs.available == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: worker/async_api/uv.lock

      - name: Install worker dependencies
        if: steps.access.outputs.available == 'true'
        working-directory: worker/async_api
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ASYNC_API_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: uv sync --group dev

      - name: Ruff check
        if: steps.access.outputs.available == 'true'
        working-directory: worker/async_api
        run: uv run ruff check .

      - name: Ruff format check
        if: steps.access.outputs.available == 'true'
        working-directory: worker/async_api
        run: uv run ruff format --check .
