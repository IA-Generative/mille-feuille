name: Unit Tests

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run tests
        required: false
        type: string
        default: "3.12"
    secrets:
      ASYNC_API_TOKEN:
        description: >-
          Jeton en lecture (Contents: read) sur le dépôt privé IA-Generative/async-api, qui héberge
          `mic-worker`. Absent, les jobs du worker async_api sont ignorés.
        required: false
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run tests
        required: false
        type: string
        default: "3.12"

jobs:
  unit-tests-backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: millefeuille
          POSTGRES_PASSWORD: millefeuille
          POSTGRES_DB: millefeuille
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U millefeuille"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        ports:
          - 9000:9000
        env:
          RUSTFS_VOLUMES: /data/rustfs0
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://millefeuille:millefeuille@localhost:5432/millefeuille
      AWS_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_S3_BUCKET_NAME: mille-feuille
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        # --group test, not --group dev: the dev group also pulls in eralchemy2
        # (ER diagram generation), whose pygraphviz dependency needs system
        # graphviz headers this runner doesn't have - CI only needs the tests.
        run: uv sync --group test

      - name: Apply database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: uv run pytest

  unit-tests-worker-document-process:
    name: worker/document_process
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/document_process/uv.lock

      - name: Install worker dependencies
        working-directory: worker/document_process
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/document_process
        run: uv run pytest

  unit-tests-worker-document-render:
    name: worker/document_render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/document_render/uv.lock

      # Même jeu de paquets que l'image du worker : sans LibreOffice, les tests marqués `libreoffice`
      # (conversion réelle d'un modèle en PDF) sont ignorés au lieu de s'exécuter.
      - name: Install LibreOffice and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui \
            fonts-liberation fonts-dejavu-core fonts-crosextra-carlito fonts-crosextra-caladea

      - name: Install worker dependencies
        working-directory: worker/document_render
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/document_render
        run: uv run pytest -rs

      - name: Check the LibreOffice tests were not skipped
        working-directory: worker/document_render
        run: |
          # `-m libreoffice` selects only the real conversions: none must be skipped (soffice found).
          output="$(uv run pytest -m libreoffice -rs -q)"
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "::error::Des tests LibreOffice ont été ignorés : soffice est introuvable sur le runner."
            exit 1
          fi

  unit-tests-worker-agent-execution:
    name: worker/agent_execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/agent_execution/uv.lock

      - name: Install worker dependencies
        working-directory: worker/agent_execution
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/agent_execution
        run: uv run pytest

  unit-tests-worker-classification:
    name: worker/classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/classification/uv.lock

      - name: Install worker dependencies
        working-directory: worker/classification
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/classification
        run: uv run pytest

  unit-tests-worker-extraction:
    name: worker/extraction
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/extraction/uv.lock

      - name: Install worker dependencies
        working-directory: worker/extraction
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/extraction
        run: uv run pytest

  unit-tests-worker-async-api:
    name: worker/async_api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASYNC_API_TOKEN: ${{ secrets.ASYNC_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check async-api access
        id: access
        run: |
          if [ -n "$ASYNC_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ASYNC_API_TOKEN absent : tests de worker/async_api ignorés."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.access.outputs.available == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: worker/async_api/uv.lock

      - name: Install worker dependencies
        if: steps.access.outputs.available == 'true'
        working-directory: worker/async_api
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ASYNC_API_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: uv sync --group dev

      - name: Run tests
        if: steps.access.outputs.available == 'true'
        working-directory: worker/async_api
        run: uv run pytest
