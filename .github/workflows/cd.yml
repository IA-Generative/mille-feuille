name: CD

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# Releases must never overlap: two pushes landing close together would run two
# release jobs against the same branch, and the loser fails on the tag the
# winner already created ("Duplicate release tag"). Queue instead of cancel -
# aborting a release midway is worse than making it wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_AMD64: true
  BUILD_ARM64: false
  LATEST_TAG: ${{ github.ref_name == 'main' }}
  USE_QEMU: false
  TAG_MAJOR_AND_MINOR: false
  TAG_SHORT_SHA: false
  # No GitHub App configured yet: releases merge by hand and the release PR
  # does not retrigger checks. Add APP_CLIENT_ID/APP_PRIVATE_KEY secrets and
  # flip these on later.
  AUTOMERGE_PRERELEASE: false
  AUTOMERGE_RELEASE: false
  PRERELEASE_BRANCH: dev
  RELEASE_BRANCH: main
  RELEASE_CONFIG_FILE: .github/releases/release-please-config-release.json
  RELEASE_MANIFEST_FILE: .github/releases/.release-please-manifest.json
  PRERELEASE_CONFIG_FILE: .github/releases/release-please-config-prerelease.json
  PRERELEASE_MANIFEST_FILE: .github/releases/.release-please-manifest-prerelease.json
  ENABLE_PRERELEASE: true

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      BUILD_AMD64: ${{ env.BUILD_AMD64 }}
      BUILD_ARM64: ${{ env.BUILD_ARM64 }}
      LATEST_TAG: ${{ env.LATEST_TAG }}
      USE_QEMU: ${{ env.USE_QEMU }}
      TAG_MAJOR_AND_MINOR: ${{ env.TAG_MAJOR_AND_MINOR }}
      TAG_SHORT_SHA: ${{ env.TAG_SHORT_SHA }}
      AUTOMERGE_PRERELEASE: ${{ env.AUTOMERGE_PRERELEASE }}
      AUTOMERGE_RELEASE: ${{ env.AUTOMERGE_RELEASE }}
      PRERELEASE_BRANCH: ${{ env.PRERELEASE_BRANCH }}
      RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
      RELEASE_CONFIG_FILE: ${{ env.RELEASE_CONFIG_FILE }}
      RELEASE_MANIFEST_FILE: ${{ env.RELEASE_MANIFEST_FILE }}
      PRERELEASE_CONFIG_FILE: ${{ env.PRERELEASE_CONFIG_FILE }}
      PRERELEASE_MANIFEST_FILE: ${{ env.PRERELEASE_MANIFEST_FILE }}
      ENABLE_PRERELEASE: ${{ env.ENABLE_PRERELEASE }}
      IMAGE_BASE: ${{ steps.image-base.outputs.IMAGE_BASE }}
      HAS_ASYNC_API_TOKEN: ${{ steps.async-api-token.outputs.HAS_ASYNC_API_TOKEN }}
    steps:
      - name: Exposing env vars
        run: echo "Exposing env vars"

      - name: Compute image base
        id: image-base
        shell: bash
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Le contexte `secrets` n'est pas lisible dans le `if` d'un job : on expose sa présence ici.
      - name: Check async-api access
        id: async-api-token
        shell: bash
        env:
          ASYNC_API_TOKEN: ${{ secrets.ASYNC_API_TOKEN }}
        run: |
          if [ -n "$ASYNC_API_TOKEN" ]; then
            echo "HAS_ASYNC_API_TOKEN=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ASYNC_API_TOKEN absent : l'image worker-async-api ne sera pas construite à la release."
            echo "HAS_ASYNC_API_TOKEN=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-app.yml@v0
    needs:
      - expose-vars
    permissions:
      issues: write
      pull-requests: write
      contents: write
    with:
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      AUTOMERGE_PRERELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_PRERELEASE == 'true' }}
      AUTOMERGE_RELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_RELEASE == 'true' }}
      PRERELEASE_BRANCH: ${{ needs.expose-vars.outputs.PRERELEASE_BRANCH }}
      RELEASE_BRANCH: ${{ needs.expose-vars.outputs.RELEASE_BRANCH }}
      RELEASE_CONFIG_FILE: ${{ needs.expose-vars.outputs.RELEASE_CONFIG_FILE }}
      RELEASE_MANIFEST_FILE: ${{ needs.expose-vars.outputs.RELEASE_MANIFEST_FILE }}
      PRERELEASE_CONFIG_FILE: ${{ needs.expose-vars.outputs.PRERELEASE_CONFIG_FILE }}
      PRERELEASE_MANIFEST_FILE: ${{ needs.expose-vars.outputs.PRERELEASE_MANIFEST_FILE }}
      ENABLE_PRERELEASE: ${{ needs.expose-vars.outputs.ENABLE_PRERELEASE == 'true' }}
    # No secrets block: without a GitHub App, this authenticates with the
    # job's own GITHUB_TOKEN, which is enough to open the release pull
    # request - it just won't retrigger CI on its own commit.

  build-docker:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs:
      - expose-vars
      - release
    if: ${{ needs.release.outputs.release-created == 'true' }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: ephemeral-frontend
            context: ephemeral-frontend
            dockerfile: ephemeral-frontend/Dockerfile
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: worker-document-process
            context: worker/document_process
            dockerfile: worker/document_process/Dockerfile
          - name: worker-agent-execution
            context: worker/agent_execution
            dockerfile: worker/agent_execution/Dockerfile
          - name: worker-classification
            context: worker/classification
            dockerfile: worker/classification/Dockerfile
          - name: worker-extraction
            context: worker/extraction
            dockerfile: worker/extraction/Dockerfile
          - name: worker-document-render
            context: worker/document_render
            dockerfile: worker/document_render/Dockerfile
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/${{ matrix.service.name }}
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ${{ matrix.service.context }}
      IMAGE_DOCKERFILE: ${{ matrix.service.dockerfile }}
      IMAGE_TARGET: runtime
      BUILD_AMD64: ${{ needs.expose-vars.outputs.BUILD_AMD64 == 'true' }}
      BUILD_ARM64: ${{ needs.expose-vars.outputs.BUILD_ARM64 == 'true' }}
      LATEST_TAG: ${{ needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' && needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      TAG_SHORT_SHA: ${{ needs.expose-vars.outputs.TAG_SHORT_SHA == 'true' }}
      CACHE: true
      CACHE_MODE: min
      BUILD_ARGS: |
        APP_VERSION=${{ needs.release.outputs.version }}

  # L'image du worker AsyncTaskAPI (worker/async_api) : contexte = racine du dépôt (elle embarque les
  # SDK), et `mic-worker` vient du dépôt privé async-api — le secret ASYNC_API_TOKEN est nécessaire au
  # build. Job séparé de la matrice, ABSENT des `needs` de bump-chart et release-chart : son échec ou
  # son absence (secret manquant) ne bloque jamais la release du chart. Les build-args alimentent
  # /app/version.json (GET /__version__ du worker).
  build-docker-worker-async-api:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs:
      - expose-vars
      - release
    if: ${{ needs.release.outputs.release-created == 'true' && needs.expose-vars.outputs.HAS_ASYNC_API_TOKEN == 'true' }}
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/worker-async-api
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: .
      IMAGE_DOCKERFILE: worker/async_api/Dockerfile
      IMAGE_TARGET: runtime
      BUILD_AMD64: ${{ needs.expose-vars.outputs.BUILD_AMD64 == 'true' }}
      BUILD_ARM64: ${{ needs.expose-vars.outputs.BUILD_ARM64 == 'true' }}
      LATEST_TAG: ${{ needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' && needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      TAG_SHORT_SHA: ${{ needs.expose-vars.outputs.TAG_SHORT_SHA == 'true' }}
      CACHE: true
      CACHE_MODE: min
      BUILD_ARGS: |
        APP_VERSION=${{ needs.release.outputs.version }}
        VERSION=${{ needs.release.outputs.version }}
        COMMIT=${{ github.sha }}
        BUILD=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SOURCE=${{ github.server_url }}/${{ github.repository }}
    secrets:
      # Lu uniquement par le Dockerfile de worker/async_api (--mount=type=secret,id=github_token).
      BUILD_SECRETS: |
        github_token=${{ secrets.ASYNC_API_TOKEN }}

  # Bump the Helm chart version + appVersion in Chart.yaml, then commit the
  # bump directly on the release branch (local mode). Runs after build-docker
  # so APP_VERSION is the version release-please just cut. The chart version
  # bumps on its own lifecycle (auto derives the level from the appVersion
  # delta), and the commit uses the 'chore(chart):' prefix so release-please
  # does not pick it up as a release-worthy change.
  bump-chart:
    uses: dnum-mi/fabnum-cicd/.github/workflows/update-helm-chart.yml@v0
    needs:
      - expose-vars
      - release
      - build-docker
    if: ${{ needs.release.outputs.release-created == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    with:
      RUN_MODE: local
      CHART_DIR: .
      CHART_NAME: millefeuille
      APP_VERSION: ${{ needs.release.outputs.version }}
      UPGRADE_TYPE: auto
      PRERELEASE_IDENTIFIER: rc

  # Package the chart (helm package) and push the tgz to the GitHub Container
  # Registry as an OCI artifact. CHECKOUT_REF picks up the bump commit pushed
  # by bump-chart so the published chart carries the new version.
  release-chart:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-helm-local.yml@v0
    needs:
      - expose-vars
      - release
      - bump-chart
    if: ${{ needs.release.outputs.release-created == 'true' }}
    permissions:
      contents: read
      packages: write
    with:
      CHARTS_DIR: .
      CHART_NAME: millefeuille
      CHECKOUT_REF: ${{ needs.bump-chart.outputs.commit-sha }}

  # Dernier volontairement, même raisonnement que Muffin/ocr-api : une
  # release pousse un commit sur main (le commit de release) que dev n'a pas
  # encore, et dev calculerait sa prochaine préversion à partir d'une base
  # obsolète sans cette synchro.
  sync-prerelease-branch:
    uses: dnum-mi/fabnum-cicd/.github/workflows/sync-prerelease-branch.yml@v0
    needs:
      - expose-vars
      - release
      # bump-chart pousse le commit « chore(chart): release » sur main : la
      # synchro doit passer après, sinon dev manque ce commit et le job
      # « Assert dev is in sync with main » échoue à la release suivante.
      - bump-chart
    if: ${{ github.ref_name == needs.expose-vars.outputs.RELEASE_BRANCH && needs.release.outputs.release-created == 'true' }}
    permissions:
      contents: write
    with:
      RELEASE_BRANCH: ${{ needs.expose-vars.outputs.RELEASE_BRANCH }}
      PRERELEASE_BRANCH: ${{ needs.expose-vars.outputs.PRERELEASE_BRANCH }}
