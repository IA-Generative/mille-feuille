repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Messages de commit : mêmes règles que le job lint-commits de la CI (types, sujet non capitalisé,
  # 100 caractères). Hook `commit-msg` : `pre-commit install --hook-type pre-commit --hook-type commit-msg`.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Lit .git/COMMIT_EDITMSG (--edit sans chemin) avec la configuration alignée sur la CI.
        entry: commitlint --config .github/commitlint.config.mjs --edit

  # Hooks locaux (pas de dépôt externe) : lancent les mêmes commandes que la
  # CI (.github/workflows/lint.yml, unit-tests.yml), mais avant même le push.
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend - typecheck (vue-tsc)
        entry: bash -c 'cd frontend && pnpm run typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: ephemeral-frontend-typecheck
        name: ephemeral-frontend - typecheck (vue-tsc)
        entry: bash -c 'cd ephemeral-frontend && pnpm run typecheck'
        language: system
        files: ^ephemeral-frontend/
        pass_filenames: false

      # Nécessite postgres/redis/rustfs locaux (voir backend/tests/.env.testing,
      # docker-compose.yaml) - contrairement au lint, ce hook suppose
      # l'environnement de dev déjà démarré (`docker compose up postgres
      # redis rustfs`). Scoppé à backend/ pour ne pas ralentir les commits qui
      # n'y touchent pas.
      - id: backend-tests
        name: backend - pytest
        entry: bash -c 'cd backend && uv run pytest -q'
        language: system
        files: ^backend/
        pass_filenames: false

      - id: worker-document-process-tests
        name: worker/document_process - pytest
        entry: bash -c 'cd worker/document_process && uv run pytest -q'
        language: system
        files: ^worker/document_process/
        pass_filenames: false

      - id: worker-agent-execution-tests
        name: worker/agent_execution - pytest
        entry: bash -c 'cd worker/agent_execution && uv run pytest -q'
        language: system
        files: ^worker/agent_execution/
        pass_filenames: false

      - id: worker-classification-tests
        name: worker/classification - pytest
        entry: bash -c 'cd worker/classification && uv run pytest -q'
        language: system
        files: ^worker/classification/
        pass_filenames: false

      - id: worker-extraction-tests
        name: worker/extraction - pytest
        entry: bash -c 'cd worker/extraction && uv run pytest -q'
        language: system
        files: ^worker/extraction/
        pass_filenames: false

      - id: worker-ocr-layout-tests
        name: worker/layout - pytest
        entry: bash -c 'cd worker/layout && uv run pytest -q'
        language: system
        files: ^worker/layout/
        pass_filenames: false

      - id: worker-ocr-tests
        name: worker/ocr - pytest
        entry: bash -c 'cd worker/ocr && uv run pytest -q'
        language: system
        files: ^worker/ocr/
        pass_filenames: false

      - id: worker-ocr-table-tests
        name: worker/table - pytest
        entry: bash -c 'cd worker/table && uv run pytest -q'
        language: system
        files: ^worker/table/
        pass_filenames: false

      - id: worker-ocr-vision-tests
        name: worker/vision - pytest
        entry: bash -c 'cd worker/vision && uv run pytest -q'
        language: system
        files: ^worker/vision/
        pass_filenames: false

      - id: worker-document-render-tests
        name: worker/document_render - pytest
        entry: bash -c 'cd worker/document_render && uv run pytest -q'
        language: system
        files: ^worker/document_render/
        pass_filenames: false
